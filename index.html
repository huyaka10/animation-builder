<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini SVG Stroke Animation Builder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>SVG Stroke Animation Builder</h1>
      <div class="topbar-actions">
        <label class="file-input">
          <input id="svgUpload" type="file" accept=".svg,image/svg+xml" />
          <span>Загрузить SVG</span>
        </label>
        <button id="restartBtn" disabled>Перезапустить</button>
        <button id="exportBtn" disabled>Экспорт анимации</button>
        <button id="exportOriginalBtn" disabled>Экспорт оригинала</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel controls-panel">
        <h2>Global</h2>
        <div class="grid">
          <label>Mode<select id="globalMode"></select></label>
          <label>Duration (s)<input id="globalDuration" type="number" min="0.1" step="0.1" value="2" /></label>
          <label>Delay (s)<input id="globalDelay" type="number" min="0" step="0.1" value="0" /></label>
          <label>Runner segment (%)<input id="globalSegment" type="number" min="1" max="100" step="1" value="20" /></label>
          <label>Direction
            <select id="globalDirection"><option value="forward">forward</option><option value="reverse">reverse</option></select>
          </label>
          <label>Easing<select id="globalEasing"></select></label>
          <label>Stroke width<input id="globalStrokeWidth" type="number" min="0.1" step="0.1" value="2" /></label>
          <label>Opacity<input id="globalOpacity" type="number" min="0.05" max="1" step="0.05" value="1" /></label>
          <label>Linecap<select id="globalLinecap"><option value="butt">butt</option><option value="round">round</option><option value="square">square</option></select></label>
          <label>Linejoin<select id="globalLinejoin"><option value="miter">miter</option><option value="round">round</option><option value="bevel">bevel</option></select></label>
        </div>
        <div class="actions-row">
          <button id="applyAllBtn" disabled>Применить ко всем</button>
          <button id="enableAllBtn" disabled>Включить все</button>
          <button id="disableAllBtn" disabled>Выключить все</button>
        </div>
      </section>

      <section class="panel preview-panel">
        <h2>Preview</h2>
        <div id="svgCanvas" class="svg-canvas empty">Загрузите SVG</div>
      </section>

      <section class="panel paths-panel">
        <h2>Paths</h2>
        <div id="pathList" class="path-list"></div>
      </section>

      <section class="panel timeline-panel">
        <div class="timeline-head">
          <h2>Timeline</h2>
          <div class="timeline-actions">
            <button id="playPauseBtn" disabled>Play</button>
            <label class="inline"><input id="timelineLoop" type="checkbox" checked />Loop</label>
          </div>
        </div>
        <div class="timeline-scale" id="timelineScale"></div>
        <div class="timeline-wrap" id="timelineWrap">
          <div id="timelineNow" class="timeline-now"></div>
          <div id="timelineTracks"></div>
        </div>
      </section>
    </main>

    <template id="pathItemTemplate">
      <article class="path-item">
        <header>
          <label class="enable-label"><input class="path-enabled" type="checkbox" checked /><span class="path-title"></span></label>
          <span class="path-length"></span>
        </header>
        <div class="grid small">
          <label>Mode<select class="path-mode"></select></label>
          <label>Duration<input class="path-duration" type="number" min="0.1" step="0.1" /></label>
          <label>Delay<input class="path-delay" type="number" min="0" step="0.1" /></label>
          <label>Runner segment %<input class="path-segment" type="number" min="1" max="100" step="1" /></label>
          <label>Direction<select class="path-direction"><option value="forward">forward</option><option value="reverse">reverse</option></select></label>
          <label>Easing<select class="path-easing"></select></label>
          <label>Stroke width<input class="path-stroke" type="number" min="0.1" step="0.1" /></label>
          <label>Opacity<input class="path-opacity" type="number" min="0.05" max="1" step="0.05" /></label>
          <label>Linecap<select class="path-linecap"><option value="butt">butt</option><option value="round">round</option><option value="square">square</option></select></label>
          <label>Linejoin<select class="path-linejoin"><option value="miter">miter</option><option value="round">round</option><option value="bevel">bevel</option></select></label>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
