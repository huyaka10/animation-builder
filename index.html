<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini SVG Stroke Animation Builder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Mini SVG Stroke Animation Builder</h1>
      <div class="topbar-actions">
        <label class="file-input">
          <input id="svgUpload" type="file" accept=".svg,image/svg+xml" />
          <span>Загрузить SVG</span>
        </label>
        <button id="restartBtn" disabled>Перезапустить анимацию</button>
        <button id="exportBtn" disabled>Экспорт SVG</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel controls-panel">
        <h2>Глобальные настройки</h2>
        <div class="grid">
          <label>Режим
            <select id="globalMode"></select>
          </label>
          <label>Скорость (сек)
            <input id="globalSpeed" type="number" min="0.1" step="0.1" value="2" />
          </label>
          <label>Задержка (сек)
            <input id="globalDelay" type="number" min="0" step="0.1" value="0" />
          </label>
          <label>Сегмент runner (%)
            <input id="globalSegment" type="number" min="1" max="100" step="1" value="20" />
          </label>
          <label>Направление
            <select id="globalDirection">
              <option value="forward">forward</option>
              <option value="reverse">reverse</option>
            </select>
          </label>
          <label>Easing
            <select id="globalEasing"></select>
          </label>
          <label>Stroke width
            <input id="globalStrokeWidth" type="number" min="0.1" step="0.1" value="2" />
          </label>
          <label>Opacity
            <input id="globalOpacity" type="number" min="0.05" max="1" step="0.05" value="1" />
          </label>
        </div>
        <div class="actions-row">
          <button id="applyAllBtn" disabled>Применить ко всем path</button>
          <button id="enableAllBtn" disabled>Включить все</button>
          <button id="disableAllBtn" disabled>Выключить все</button>
        </div>
      </section>

      <section class="panel preview-panel">
        <h2>Превью</h2>
        <div id="svgCanvas" class="svg-canvas empty">Загрузите SVG для начала</div>
      </section>

      <section class="panel paths-panel">
        <h2>Path list</h2>
        <div id="pathList" class="path-list"></div>
      </section>
    </main>

    <template id="pathItemTemplate">
      <article class="path-item">
        <header>
          <label class="enable-label">
            <input class="path-enabled" type="checkbox" checked />
            <span class="path-title"></span>
          </label>
          <span class="path-length"></span>
        </header>
        <div class="grid small">
          <label>Mode
            <select class="path-mode"></select>
          </label>
          <label>Speed
            <input class="path-speed" type="number" min="0.1" step="0.1" />
          </label>
          <label>Delay
            <input class="path-delay" type="number" min="0" step="0.1" />
          </label>
          <label>Runner segment %
            <input class="path-segment" type="number" min="1" max="100" step="1" />
          </label>
          <label>Direction
            <select class="path-direction">
              <option value="forward">forward</option>
              <option value="reverse">reverse</option>
            </select>
          </label>
          <label>Easing
            <select class="path-easing"></select>
          </label>
          <label>Stroke width
            <input class="path-stroke" type="number" min="0.1" step="0.1" />
          </label>
          <label>Opacity
            <input class="path-opacity" type="number" min="0.05" max="1" step="0.05" />
          </label>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
