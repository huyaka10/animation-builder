<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lottie → SVG (JS animation)</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
      #preview { border: 1px solid #ccc; min-height: 240px; padding: 12px; }
    </style>
  </head>
  <body>
    <h1>Lottie JSON → Animated SVG</h1>

    <div class="controls">
      <input id="fileInput" type="file" accept=".json,application/json" />
      <button id="convertBtn" type="button">Convert</button>
      <button id="downloadBtn" type="button">Download SVG</button>
    </div>

    <p id="status"></p>
    <div id="preview"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
