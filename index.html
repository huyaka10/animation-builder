<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Таблица метрик и срезов</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar" aria-label="Левая панель">
        <div class="sidebar__logo"></div>
        <div class="sidebar__spacer"></div>
        <button class="sidebar__icon" aria-label="Помощь">?</button>
        <button class="sidebar__icon" aria-label="Настройки">⚙</button>
        <button class="sidebar__icon" aria-label="Обратная связь">✉</button>
        <div class="sidebar__avatar"></div>
      </aside>

      <main class="content">
        <header class="content__header">
          <div>
            <h1>Какое-то название расчёта <span class="status">Выполнен</span></h1>
            <p>Период расчёта метрик 26.06.2023 11:20 – 08.07.2023 12:20</p>
          </div>
          <div class="controls">
            <input id="searchInput" type="search" placeholder="Поиск по названию" autocomplete="off" />
            <div class="toolbar">
              <div class="tab-group" role="tablist" aria-label="Режим отображения">
                <button id="viewHierarchy" class="tab active" role="tab" aria-selected="true">Таблица</button>
                <button id="viewSlices" class="tab" role="tab" aria-selected="false">Срезы × метрики</button>
              </div>
              <button id="filterModeToggle" class="filter">⎚ Фильтр</button>
            </div>
          </div>
          <div id="filterModeActions" class="filter-actions hidden">
            <button id="showAllRowsBtn">Показать все</button>
            <button id="hideNonKeyBtn">Оставить только важные</button>
          </div>
        </header>

        <section id="tableCard" class="table-card">
          <table>
            <thead>
              <tr id="tableHeadRow"></tr>
            </thead>
            <tbody id="metricsTableBody"></tbody>
          </table>
        </section>

        <footer class="content__footer">
          <button>Вернуться к списку</button>
          <button disabled>Редактировать</button>
        </footer>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
